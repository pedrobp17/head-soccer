<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura de superpoder · Vista previa</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101820; color: #eff7fb; display: grid; place-items: center; padding: 24px; }
    main { width: min(1050px, 100%); }
    h1 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 34px); }
    p { color: #a9c1d0; line-height: 1.5; margin: 0 0 24px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 22px; }
    .stage, .settings { border: 1px solid #304858; border-radius: 16px; background: #172630; }
    .stage { padding: 18px; overflow: hidden; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 8px; }
    .timeline { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
    input[type="range"] { min-width: 0; flex: 1; accent-color: #39d7ff; cursor: pointer; }
    output { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; color: #c6e4f3; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button, select { font: inherit; color: inherit; border: 1px solid #3a586b; background: #223b4b; border-radius: 8px; padding: 10px 12px; }
    button { cursor: pointer; }
    button:hover { background: #2e5064; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #39d7ff; outline-offset: 3px; }
    #reproducir { background: #89e4fa; color: #08232e; border-color: #89e4fa; min-width: 110px; font-weight: 650; }
    .settings { display: flex; flex-direction: column; gap: 20px; padding: 24px; }
    .field { display: grid; gap: 8px; }
    .field > span { color: #b4cbd8; font-size: 14px; }
    .check { display: flex; align-items: center; gap: 9px; font-size: 14px; }
    input[type="checkbox"] { accent-color: #39d7ff; }
    .phase { border-top: 1px solid #304858; padding-top: 18px; margin-top: auto; }
    .phase small { color: #a9c1d0; }
    #fase { display: block; margin-top: 7px; color: #8ee8ff; font-size: 20px; }
    #error { color: #ffab9d; margin: 14px 0 0; }
    footer { color: #8faebf; font-size: 13px; margin-top: 16px; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 18px; } .phase { border: 0; padding: 0; margin: 0; } body { padding: 14px; } }
  </style>
</head>
<body>
<main>
  <h1>Aura de superpoder</h1>
  <p>19 fotogramas de 200 × 200 píxeles. Cambia de jugador o recorre la animación paso a paso.</p>
  <div class="layout">
    <section class="stage" aria-label="Reproductor de animación">
      <canvas id="lienzo" width="320" height="260" aria-label="Vista del aura sobre el personaje"></canvas>
      <div class="timeline">
        <input id="fotograma" aria-label="Fotograma" type="range" min="0" max="18" value="0" step="1">
        <output id="contador" for="fotograma">1 / 19</output>
      </div>
      <div class="buttons">
        <button id="reproducir" type="button">Pausar</button>
        <button id="anterior" type="button" aria-label="Fotograma anterior">← Anterior</button>
        <button id="siguiente" type="button" aria-label="Fotograma siguiente">Siguiente →</button>
        <button id="reiniciar" type="button">Reiniciar</button>
      </div>
      <p id="error" role="alert" hidden></p>
    </section>
    <aside class="settings" aria-label="Opciones de visualización">
      <label class="field"><span>Jugador</span><select id="jugador"><option value="MarkEvans">Mark Evans</option><option value="AxelBlaze">Axel Blaze</option><option value="JudeSharp">Jude Sharp</option><option value="">Solo aura</option></select></label>
      <label class="field"><span>Velocidad</span><select id="velocidad"><option value="5">5 fps · lenta</option><option value="10" selected>10 fps · original</option><option value="15">15 fps</option><option value="20">20 fps · rápida</option></select></label>
      <label class="field"><span>Fondo</span><select id="fondo"><option value="campo">Campo</option><option value="oscuro">Oscuro</option><option value="claro">Claro</option><option value="cuadricula">Cuadrícula</option></select></label>
      <label class="check"><input id="bucle" type="checkbox" checked> Repetir animación</label>
      <label class="check"><input id="detras" type="checkbox" checked> Aura detrás del jugador</label>
      <div class="phase"><small>Fase actual</small><strong id="fase">Carga</strong></div>
    </aside>
  </div>
  <footer>Las imágenes están incluidas en este HTML: puedes abrirlo directamente sin servidor ni conexión.</footer>
</main>

const buscar = id => document.getElementById(id);
const controles = Object.fromEntries(['fotograma', 'contador', 'reproducir', 'anterior', 'siguiente', 'reiniciar', 'jugador', 'velocidad', 'fondo', 'bucle', 'detras', 'fase', 'error'].map(id => [id, buscar(id)]));
const lienzo = buscar('lienzo');
const contexto = lienzo.getContext('2d');
contexto.imageSmoothingEnabled = false;
const imagenes = {};
let fotograma = 0;
let reproduciendo = true;
let acumulado = 0;
let instanteAnterior = null;

function sincronizar() {
  controles.fotograma.value = String(fotograma);
  controles.contador.textContent = `${fotograma + 1} / 19`;
  controles.reproducir.textContent = reproduciendo ? 'Pausar' : 'Reproducir';
  controles.fase.textContent = fotograma === 18 ? 'Final' : fotograma >= 15 ? 'Disipación' : fotograma >= 3 ? 'Aura activa' : fotograma === 2 ? 'Destello' : fotograma === 1 ? 'Encendido' : 'Carga';
}

function dibujar() {
  const fondo = controles.fondo.value;
  contexto.fillStyle = fondo === 'claro' ? '#e6edf2' : fondo === 'campo' ? '#163d39' : '#101820';
  contexto.fillRect(0, 0, 320, 260);
  if (fondo === 'cuadricula') {
    for (let y = 0; y < 260; y += 20) for (let x = 0; x < 320; x += 20) {
      contexto.fillStyle = ((x + y) / 20) % 2 ? '#354653' : '#25333e';
      contexto.fillRect(x, y, 20, 20);
    }
  } else if (fondo === 'campo') {
    contexto.fillStyle = '#29624b'; contexto.fillRect(0, 217, 320, 43);
    contexto.fillStyle = '#619778'; contexto.fillRect(0, 217, 320, 1);
  }
  const dibujarAura = () => {
    const imagen = imagenes.aura;
    if (imagen?.complete && imagen.naturalWidth) contexto.drawImage(imagen, fotograma * 200, 0, 200, 200, 60, 25, 200, 200);
  };
  const dibujarJugador = () => {
    const imagen = imagenes[controles.jugador.value];
    if (imagen?.complete && imagen.naturalWidth) contexto.drawImage(imagen, 0, 200, 155, 200, 60, 45, 155, 200);
  };
  if (controles.detras.checked) { dibujarAura(); dibujarJugador(); }
  else { dibujarJugador(); dibujarAura(); }
}

function seleccionar(valor) {
  fotograma = ((valor % 19) + 19) % 19;
  reproduciendo = false;
  acumulado = 0;
  sincronizar(); dibujar();
}

controles.reproducir.onclick = () => {
  if (!reproduciendo && fotograma === 18) fotograma = 0;
  reproduciendo = !reproduciendo;
  acumulado = 0;
  sincronizar(); dibujar();
};
controles.anterior.onclick = () => seleccionar(fotograma - 1);
controles.siguiente.onclick = () => seleccionar(fotograma + 1);
controles.fotograma.oninput = () => seleccionar(Number(controles.fotograma.value));
controles.reiniciar.onclick = () => { fotograma = 0; acumulado = 0; reproduciendo = true; sincronizar(); dibujar(); };
controles.velocidad.onchange = () => { acumulado = 0; };
for (const nombre of ['jugador', 'fondo', 'detras']) controles[nombre].onchange = dibujar;

for (const [nombre, datos] of Object.entries(datosImagenes)) {
  const imagen = new Image();
  imagenes[nombre] = imagen;
  imagen.onload = dibujar;
  imagen.onerror = () => { controles.error.hidden = false; controles.error.textContent = 'No se ha podido cargar una de las imágenes incluidas.'; };
  imagen.src = datos;
}

function animar(instante) {
  const delta = instanteAnterior === null ? 0 : Math.max(0, Math.min(100, instante - instanteAnterior));
  instanteAnterior = instante;
  if (reproduciendo) {
    acumulado += delta * Number(controles.velocidad.value) / 1000;
    while (acumulado >= 1) {
      acumulado -= 1;
      if (fotograma < 18) fotograma++;
      else if (controles.bucle.checked) fotograma = 0;
      else { reproduciendo = false; acumulado = 0; break; }
    }
    sincronizar();
  }
  dibujar();
  requestAnimationFrame(animar);
}
sincronizar();
requestAnimationFrame(animar);
</script>
